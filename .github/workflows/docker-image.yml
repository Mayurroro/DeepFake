name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build Docker image
      run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} -t ghcr.io/${{ github.repository }}:latest .

    - name: Test image starts
      run: |
        docker run -d --name test -p 8501:8501 ghcr.io/${{ github.repository }}:${{ github.sha }}
        sleep 5
        curl -f http://localhost:8501/_stcore/health || exit 1
        docker stop test

    - name: Push to ghcr.io
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: docker push ghcr.io/${{ github.repository }} --all-tags
